<!doctype html>

    <meta name="robots" content="index, follow" />

    <!--
      Platzhalter-Domain: "https://example.com" muss vor dem Go-Live durch
      die endgültige Domain ersetzt werden (hier, in robots.txt und in
      sitemap.xml). Ohne echte Domain würden Suchmaschinen und
      Social-Media-Vorschauen sonst falsche Adressen anzeigen.
    -->
    <link rel="canonical" href="https://example.com/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="SOGUM" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:title" content="SOGUM — Koreanisches Restaurant in Frankfurt-Nordend" />

      property="og:description"
      content="Wärme in jeder Schale — traditionelle koreanische Gerichte, neu gedacht mit regionalen Zutaten. Glauburgstraße 34, Frankfurt am Main."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Wärme in jeder Schale — traditionelle koreanische Gerichte, neu gedacht mit regionalen Zutaten."
    />
